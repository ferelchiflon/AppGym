<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GYM PRO — Registro de entrenamiento profesional</title>
<meta name="description" content="Registro de entrenamiento profesional, periodización y cálculo de 1RM">
<meta name="theme-color" content="#0B0E14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="GYM PRO">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM PRO">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
<link rel="manifest" href="manifest.json">

<!-- ============================================================
     CRITICAL CSS INLINE (above-the-fold, ~1KB)
     ============================================================ -->
<style>
:root{
  --canvas:#0B0E14;--surface:#131822;--surface-alt:#1A2030;
  --text-primary:#F4F6FB;--text-secondary:#9AA4BD;
  --border:rgba(255,255,255,.07);
  --accent:#C6FF3D;--accent-soft:rgba(198,255,61,.14);
  --radius-card:clamp(14px,2vw,18px);
  --info-bg:rgba(86,156,255,.16);--info-text:#7DB7FF;
  --success-bg:rgba(72,209,122,.16);--success-text:#54E08A;
  --danger-bg:rgba(255,95,95,.16);--danger-text:#FF7A7A;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Helvetica Neue',-apple-system,system-ui,sans-serif}
html{font-size:100%;scroll-behavior:smooth}
body{
  background:var(--canvas);color:var(--text-primary);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;min-height:100dvh;
  padding:clamp(.5rem,2.5vw,2.5rem) clamp(.75rem,2vw,1.5rem) calc(5.5rem + env(safe-area-inset-bottom, 0px));
  line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.app{
  max-width:1300px;width:100%;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-card);
  padding:clamp(1rem,3vw,2rem) clamp(1rem,3vw,2rem) clamp(1.5rem,3vw,2.5rem);
}
h1{
  font-weight:700;font-size:clamp(1.3rem,1rem + 2vw,1.9rem);
  letter-spacing:-.03em;line-height:1.1;display:flex;align-items:center;gap:.75rem;
  margin-bottom:clamp(1rem,2.5vw,1.5rem);border-bottom:1px solid var(--border);
  padding-bottom:clamp(.75rem,1.8vw,1.1rem);flex-wrap:wrap;
}
h1 span.version-tag{background:var(--accent-soft);color:var(--accent);font-weight:700;
  text-transform:uppercase;padding:.3rem .75rem;border-radius:9999px;font-size:.7rem;}
.grid-2{display:grid;grid-template-columns:1fr;gap:clamp(1rem,2vw,1.5rem);}
@media (min-width:768px){.grid-2{grid-template-columns:1fr 1fr;}}
.card{
  background:var(--surface-alt);border:1px solid var(--border);
  border-radius:var(--radius-card);padding:clamp(1.1rem,2.5vw,1.75rem);
  margin-bottom:0;
}
.card h2{font-weight:600;font-size:clamp(1.05rem,.95rem + .8vw,1.25rem);
  letter-spacing:-.01em;margin-bottom:clamp(.9rem,2vw,1.25rem);
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
button{font:inherit}
.hidden{display:none!important}
.empty-message{color:var(--text-secondary);font-size:.9rem;padding:.5rem 0}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
</style>

<!-- CSS diferido: se precarga y se aplica de forma fiable.
     Se excluye el atributo print/onload (antipatrón que puede dejar
     el CSS sin aplicar si el evento load no dispara) y se usa el
     enfoque estándar de hoja normal. -->
<link rel="preload" href="styles/index.css" as="style">
<link rel="stylesheet" href="styles/index.css">

<link rel="prefetch" href="src/charts-manager.js" as="script">
<link rel="prefetch" href="src/gestor-periodizacion.js" as="script">
</head>

<body>
<div class="app" id="app"></div>

<!-- Las vistas modulares (drawer/header/dashboard/workout/history/progress/profile/chrome)
     se ensamblan sincronicamente en #app desde src/main.js ANTES de instanciar
     AppGymPro. -->
<script type="module" src="./src/main.js" defer></script>
</body>
</html>
