name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalación limpia de dependencias
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Chequeo de tipos (TypeScript)
        run: npm run typecheck

      - name: Tests unitarios (Vitest)
        run: npm test

      - name: Cobertura de código (umbrales Vitest)
        # Genera el reporte y valida los umbrales configurados en vitest.config.js
        # (lines/statements/functions/branches). Falla el job si se violan.
        run: npm run test:coverage

      - name: Verificación de compilación (Build)
        run: npm run build